# A tag vX.Y.Z (the version in package.json) publishes a GitHub release with:
#   Arcade-browser-chromium-X.Y.Z.zip   load unpacked in Chrome, Edge, Brave, Vivaldi (same ID everywhere: the
#                                       manifest's fixed key)
#   Arcade-browser-firefox-X.Y.Z.xpi    signed by Mozilla as an unlisted add-on, when the owner has set
#                                       AMO_JWT_ISSUER and AMO_JWT_SECRET (gh secret set); otherwise
#                                       Arcade-browser-firefox-X.Y.Z-unsigned.zip, for Firefox Developer Edition
#                                       or Nightly with signing turned off, or about:debugging
#   Arcade-browser-source-X.Y.Z.zip     what Mozilla's reviewers get with the signed add-on
#   SHA256SUMS
# A prerelease tag (vX.Y.Z-rc.N) is published as a prerelease and never sent to Mozilla: Firefox versions have no
# prerelease part, so an rc would use up X.Y.Z there.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag names package.json's version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in *-*) echo "PRERELEASE=1" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=" >> "$GITHUB_ENV" ;; esac
      - name: Types, unit tests and both builds
        run: npm run check
      - name: Mozilla's add-on checks on the Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/firefox
      - name: Packages
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          (cd dist/chromium && zip -q -r -X "$out/Arcade-browser-chromium-$VERSION.zip" .)
          git archive --format=zip -o "$out/Arcade-browser-source-$VERSION.zip" HEAD
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Firefox package (signed by Mozilla when the keys are set)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ] && [ -z "$PRERELEASE" ]; then
            npx --yes web-ext@10.8.0 sign --channel unlisted --source-dir dist/firefox \
              --artifacts-dir "$RUNNER_TEMP/signed" --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
              --upload-source-code "$OUT/Arcade-browser-source-$VERSION.zip" --approval-timeout 1200000
            signed=$(ls "$RUNNER_TEMP"/signed/*.xpi)
            mv "$signed" "$OUT/Arcade-browser-firefox-$VERSION.xpi"
            echo "FIREFOX=signed" >> "$GITHUB_ENV"
          else
            (cd dist/firefox && zip -q -r -X "$OUT/Arcade-browser-firefox-$VERSION-unsigned.zip" .)
            echo "FIREFOX=unsigned" >> "$GITHUB_ENV"
          fi
      - name: Checksums
        run: cd "$OUT" && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "$VERSION" "$FIREFOX" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "Arcade for browsers $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            ${PRERELEASE:+--prerelease} "$OUT"/*
