name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build both browsers
        run: npm run build
      - name: Design kit matches Link's pinned tag
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/sync-design.py --check
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: End to end (${{ matrix.browser }}, real helper and Box)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Runtime libraries for Arcade Box
        run: scripts/ci/apt-install.sh --no-install-recommends xvfb xauth libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - name: Released Arcade Tools (for its helper) and Arcade Box
        run: python3 scripts/ci/fetch-apps.py "$RUNNER_TEMP/apps" >> "$GITHUB_ENV"
      - name: Chromium
        if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps chromium
      - name: Firefox
        if: matrix.browser == 'firefox'
        run: |
          firefox --version
          echo "FIREFOX=$(command -v firefox)" >> "$GITHUB_ENV"
      - name: Tests
        run: xvfb-run -a node --test --test-reporter=spec --test-concurrency=1 "test/e2e/${{ matrix.browser }}.test.ts"
